<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Le Pendu de la Faille">
  <title>Le Pendu de la Faille</title>

  <!-- Même mascotte que le pendu du jeu (index.html), à l'étape 10 : yeux en
       croix. Les proportions reprennent celles du SVG du jeu (le rayon du
       corps passe de 55 à 15, soit un facteur 0.2727, appliqué aux oreilles,
       aux pattes, aux yeux et au museau), mais les épaisseurs de trait sont
       volontairement recalculées : reprendre celles du jeu à l'identique
       donnerait des traits de moins d'un pixel à 16x16. -->

  <defs>
    <!-- Léger dégradé du bleu nuit : le fond plat paraissait terne à petite
         taille, à côté des favicons voisins dans la barre d'onglets. -->
    <linearGradient id="tuile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233B" />
      <stop offset="1" stop-color="#0A1428" />
    </linearGradient>
  </defs>

  <!-- Tuile à coins arrondis, bleu nuit de la charte (variable color-bg).
       Attention : un commentaire XML/SVG ne peut pas contenir deux tirets à la
       suite, on ne peut donc pas y écrire le nom complet d'une variable CSS.

       Ce fichier est chargé comme icône, isolément de la page : il n'a donc
       accès à aucune variable CSS et doit répéter les valeurs en dur. Elles
       sont recopiées à l'identique depuis css/variables.css — #0A1428 pour
       color-bg, #0F1B2E pour color-bg-card, #C8AA6E pour color-accent,
       #F0E6CF pour color-text. Si la charte change, ce fichier est le seul
       endroit à mettre à jour à la main. -->
  <rect width="64" height="64" rx="14" fill="url(#tuile)" />

  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Corde -->
    <line x1="32" y1="2" x2="32" y2="20" stroke="#C8AA6E" stroke-width="3" />

    <!-- Oreilles (sous le corps, comme dans le jeu : la pointe part de
         derrière la tête) -->
    <polygon points="21.6,24.6 17.8,9.1 28.5,20.8" fill="#C8AA6E" />
    <polygon points="42.4,24.6 46.2,9.1 35.5,20.8" fill="#C8AA6E" />

    <!-- Corps -->
    <circle cx="32" cy="35" r="15" fill="#0F1B2E" stroke="#C8AA6E" stroke-width="3.4" />

    <!-- Yeux en croix (étape 10 : la mascotte est morte) -->
    <g stroke="#F0E6CF" stroke-width="2">
      <line x1="24.5" y1="30.3" x2="28.5" y2="34.3" />
      <line x1="28.5" y1="30.3" x2="24.5" y2="34.3" />
      <line x1="35.5" y1="30.3" x2="39.5" y2="34.3" />
      <line x1="39.5" y1="30.3" x2="35.5" y2="34.3" />
    </g>

    <!-- Museau -->
    <circle cx="32" cy="39.9" r="1.2" fill="#C8AA6E" />

    <!-- Pattes -->
    <circle cx="19.7" cy="47.3" r="3.6" fill="#0F1B2E" stroke="#C8AA6E" stroke-width="2.8" />
    <circle cx="44.3" cy="47.3" r="3.6" fill="#0F1B2E" stroke="#C8AA6E" stroke-width="2.8" />
  </g>
</svg>
